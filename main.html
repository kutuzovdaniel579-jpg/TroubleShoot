<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>TroubleShooter</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <style>
    body {
      margin: 0;
      padding: 0;
      font-family: Arial, sans-serif;
      background-color: #f8f8f8;
      color: #333;
      text-align: center;
    }

    .container {
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      height: 100vh;
      padding: 20px;
    }

    h1 {
      font-size: 3em;
      color: #d9534f;
      margin-bottom: 20px;
    }

    p {
      font-size: 1.2em;
      max-width: 600px;
    }

    select {
      margin-top: 30px;
      padding: 8px;
      font-size: 1em;
    }
  </style>
</head>
<body>
  <div class="container">
    <h1 id="error-title">ERROR CODE</h1>
    <p id="error-message">Loading…</p>
    <p id="owner"></p>

    <select onchange="changeLanguage(this.value)">
      <option value="en">English</option>
      <option value="nl">Nederlands</option>
      <option value="fr">Français</option>
    </select>
  </div>

  <script>
    // --- URL PARAMETER PARSER ---
    const params = new URLSearchParams(window.location.search);

    const errorCode = params.get("error_code") || "1";
    const customTitle = params.get("title") || null;
    const customDescription = params.get("description") || null;
    const owner = params.get("owner") || null;

    // --- TRANSLATIONS ---
    const translations = {
      en: {
        title: customTitle || `ERROR CODE ${errorCode}`,
        message: customDescription || "You were redirected to this page because the website is not finished yet.",
        owner: owner ? `Reported by: ${owner}` : ""
      },
      nl: {
        title: customTitle || `FOUTCODE ${errorCode}`,
        message: customDescription || "U bent doorgestuurd naar deze pagina omdat de website nog niet klaar is.",
        owner: owner ? `Melding door: ${owner}` : ""
      },
      fr: {
        title: customTitle || `CODE D'ERREUR ${errorCode}`,
        message: customDescription || "Vous avez été redirigé vers cette page car le site n'est pas encore terminé.",
        owner: owner ? `Signalé par: ${owner}` : ""
      }
    };

    // --- DEFAULT LANGUAGE ---
    let currentLang = "en";

    function applyText() {
      document.getElementById("error-title").textContent = translations[currentLang].title;
      document.getElementById("error-message").textContent = translations[currentLang].message;
      document.getElementById("owner").textContent = translations[currentLang].owner;
    }

    function changeLanguage(lang) {
      currentLang = lang;
      applyText();
    }

    // Apply on load
    applyText();
  </script>
</body>
</html>
